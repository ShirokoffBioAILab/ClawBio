AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated HealthOmics public/synthetic smoke environment; no image publication or run submission.
Parameters:
  Owner:
    Type: String
    MinLength: 1
    Description: Resource owner responsible for costs and cleanup
  MaxDurationMinutes:
    Type: Number
    Default: 60
    MinValue: 1
    MaxValue: 240
Resources:
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: owner
          Value: {Ref: Owner}
        - Key: purpose
          Value: healthomics-smoke
  Images:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: false
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: omics.amazonaws.com}
            Action: ['ecr:BatchGetImage', 'ecr:GetDownloadUrlForLayer', 'ecr:BatchCheckLayerAvailability']
            Condition:
              StringEquals:
                aws:SourceAccount: {Ref: 'AWS::AccountId'}
              ArnLike:
                aws:SourceArn: {Fn::Sub: 'arn:${AWS::Partition}:omics:${AWS::Region}:${AWS::AccountId}:workflow/*'}
      Tags:
        - Key: owner
          Value: {Ref: Owner}
        - Key: purpose
          Value: healthomics-smoke
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: omics.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: {Ref: 'AWS::AccountId'}
              ArnLike:
                aws:SourceArn: {Fn::Sub: 'arn:${AWS::Partition}:omics:${AWS::Region}:${AWS::AccountId}:run/*'}
      Policies:
        - PolicyName: SmokeRunIO
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetBucketLocation', 's3:ListBucket']
                Resource: {Fn::GetAtt: [Artifacts, Arn]}
              - Effect: Allow
                Action: ['s3:GetObject']
                Resource: {Fn::Sub: '${Artifacts.Arn}/inputs/*'}
              - Effect: Allow
                Action: ['s3:GetObject', 's3:PutObject', 's3:AbortMultipartUpload', 's3:ListMultipartUploadParts']
                Resource: {Fn::Sub: '${Artifacts.Arn}/outputs/*'}
              - Effect: Allow
                Action: ['logs:CreateLogGroup', 'logs:CreateLogStream', 'logs:PutLogEvents', 'logs:DescribeLogStreams']
                Resource: {Fn::Sub: 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/omics/WorkflowLog:*'}
      Tags:
        - Key: owner
          Value: {Ref: Owner}
  RunGroup:
    Type: AWS::Omics::RunGroup
    Properties:
      MaxRuns: 1
      MaxCpus: 16
      MaxGpus: 1
      MaxDuration: {Ref: MaxDurationMinutes}
      Tags:
        owner: {Ref: Owner}
        purpose: healthomics-smoke
Outputs:
  InputPrefix:
    Value: {Fn::Sub: 's3://${Artifacts}/inputs/'}
  OutputPrefix:
    Value: {Fn::Sub: 's3://${Artifacts}/outputs/'}
  RepositoryUri:
    Value: {Fn::GetAtt: [Images, RepositoryUri]}
  RoleArn:
    Value: {Fn::GetAtt: [ExecutionRole, Arn]}
  RunGroupId:
    Value: {Fn::GetAtt: [RunGroup, Id]}
